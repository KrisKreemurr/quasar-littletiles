plugins {
    id 'eclipse'
    id 'idea'
    id 'com.modrinth.minotaur' version '2.+'
    id 'net.neoforged.moddev' version '2.0.+'
}

repositories {
    maven { url = 'https://maven.fabricmc.net' }
}

group= "team.creative" + project.mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

java.sourceSets.create("api") {
    java {
        srcDir("src/api/java")
    }
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}

sourceSets.main.compileClasspath += sourceSets.api.output
sourceSets.main.runtimeClasspath += sourceSets.api.output

// Quasar MC: compat for mods that aren't in our pack (or not on 26.3 yet) is left out of the build.
// Bring a folder back once that mod exists for 26.3.
sourceSets.main.java {
    exclude 'team/creative/littletiles/client/mod/sodium/**'
    exclude 'team/creative/littletiles/client/mod/iris/**'
    exclude 'team/creative/littletiles/common/mod/jade/**'
    exclude 'team/creative/littletiles/common/mod/jei/**'
    exclude 'team/creative/littletiles/common/mod/sable/**'
    exclude 'team/creative/littletiles/common/mod/theoneprobe/**'
    exclude 'team/creative/littletiles/mixin/sodium/**'
    exclude 'team/creative/littletiles/mixin/sable/**'
}

// show every compile error while porting, not just the first 100
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xmaxerrs', '10000']
}

project.evaluationDependsOn(":CreativeCore")

neoForge {
    version = "${forge_version}"
    validateAccessTransformers = true

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        LittleTiles {
            sourceSet sourceSets.main
            sourceSet sourceSets.api
        }
        CreativeCore {
            sourceSet project(':CreativeCore').sourceSets.main
        }
    }
}

dependencies {
    implementation project(':CreativeCore')
}

modDependencies = [
    [ modId: "creativecore", type: "required", ordering: "NONE", side: "BOTH", versionRange: "[" + creativecore_version + ",)" ]
]
modMixins = [ "littletiles.mixins.json" ]
modProperties = [
    '',
    '["lithium:options"]',
    '    "mixin.shapes.specialized_shapes" = false',
    '    "mixin.entity.collisions" = false'
]
modImplemented = [
    [ name: "net.fabricmc:fabric-loader:${project.fabric_version}", disabled: true ]
]
